<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Stages of Life</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="intro">

    <h1>The Stages of Life</h1>

    <div class="intro-message">

        <p>
            時間は、誰も待ってはくれない。<br>
            Time never waits for anyone.
        </p>
        <br>
        <p>
            この作品は、「今」という時間を見つめるための作品です。<br>
            This work is an experience about reflecting on the present moment.
        </p>

    </div>

    <button id="enterButton">
        <span>進む</span>
        <span>Enter</span>
    </button>

</div>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    background:
    radial-gradient(
        circle at center,
        #1B2B4A 0%,
        #101A33 45%,
        #0B1226 100%
    );

    color:#f5f7fa;
    font-family:
        "Zen Maru Gothic",
        sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity 1.5s;
}

body.fade-out{
    opacity:0;
}

.intro{
    text-align:center;
    max-width:700px;
    padding:40px;
    animation:fadeIn 2s ease;
}

h1{
    font-weight:200;
    letter-spacing:8px;
    margin-bottom:60px;
}

.intro-message{
    line-height:2;
    color:#d0d5dc;
    margin-bottom:70px;
}

button{
    background:none;
    color:#ffffff;
    border:1px solid rgba(255,255,255,.4);
    border-radius:30px;
    padding:15px 60px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:rgba(255,255,255,.08);
}

button span{
    display:block;
}

button span:last-child{
    font-size:13px;
    color:#aaa;
    margin-top:5px;

}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}
</style>

<script>
    
    const enterButton = document.getElementById("enterButton");
    const intro = document.querySelector(".intro");

    enterButton.addEventListener("click", () => {
        intro.style.display = "none";
        window.location.href = "main.html"; 
    });
</Script>

</body>
</html>
